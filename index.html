<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Debilidad Taquería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7C925; --ink:#2A1A0A; --red:#C8102E; --green:#16733A; --paper:#FFE27A; --muted:#6B4A1E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1E1508;--ink:#FBE7A8;--red:#FF5A6E;--green:#4CC77A;--paper:#2C2010;--muted:#D2B574}
}
:root[data-theme="dark"]{--bg:#1E1508;--ink:#FBE7A8;--red:#FF5A6E;--green:#4CC77A;--paper:#2C2010;--muted:#D2B574}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
.stripe{height:22px;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) -11px 0/22px 22px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) -11px 0/22px 22px,
  linear-gradient(315deg,var(--green) 25%,transparent 25%) 0 0/22px 22px,
  linear-gradient(45deg,var(--green) 25%,transparent 25%) 0 0/22px 22px}
header{text-align:center;padding:28px 20px 18px}
h1{font-family:"Lilita One",Impact,"Arial Black",sans-serif;font-weight:400;color:var(--red);font-size:clamp(2.6rem,11vw,4.6rem);line-height:.95;margin:0;transform:rotate(-2deg)}
header p{margin:12px auto 0;max-width:30ch;color:var(--muted);font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--ink);overflow-x:auto;white-space:nowrap;padding:10px 16px}
nav a{display:inline-block;margin-right:8px;padding:6px 14px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
nav a:focus-visible,.cta:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:8px 18px 120px}
section{padding-top:26px}
h2{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:1.9rem;color:var(--green);margin:0 0 6px}
.item{padding:14px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 30%,transparent)}
.row{display:flex;align-items:baseline;gap:8px}
.row h3{margin:0;font-size:1.15rem;font-weight:700}
.row .dots{flex:1;border-bottom:2px dotted var(--muted);transform:translateY(-4px)}
.price{font-weight:700;color:var(--red);font-size:1.15rem}
.desc{margin:3px 0 0;color:var(--muted);font-size:.97rem}
.opts{margin:8px 0 0;padding:0;list-style:none}
.opts li{display:flex;gap:8px;font-size:.98rem;padding:2px 0}
.opts li span:first-child{flex:1}
.opts li b{color:var(--red)}
.find{margin-top:34px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:18px}
.find h2{color:var(--red)}
.find p{margin:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);display:flex;gap:10px;justify-content:center}
.cta{flex:1;max-width:300px;text-align:center;padding:14px;border-radius:12px;font-weight:700;text-decoration:none;font-size:1.05rem}
.cta.main{background:var(--red);color:#fff}
.cta.alt{background:var(--green);color:#fff}
@media (prefers-reduced-motion:no-preference){h1{animation:pop .6s ease-out}@keyframes pop{from{transform:rotate(-2deg) scale(.85);opacity:0}}}
.qty{display:inline-flex;align-items:center;gap:6px;margin-left:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 1.2rem/1 Barlow,Arial,sans-serif;cursor:pointer}
.qty button.add{background:var(--green);border-color:var(--green);color:#fff}
.qty button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.qty .n{min-width:1.2em;text-align:center;font-weight:700}
.qty .n:empty,.qty button.sub[hidden]{display:none}
.row.single{align-items:center}
.row.single .dots{transform:none}
.line{display:flex;align-items:center;gap:8px;padding:6px 0}
.line .nm{flex:1}
.line .pr{color:var(--red);font-weight:700}
button.cta{border:0;cursor:pointer;font-family:inherit}
.cta.wa{background:#1FA855;color:#fff}
dialog{border:3px solid var(--ink);border-radius:18px;background:var(--bg);color:var(--ink);width:min(520px,94vw);max-height:88vh;max-height:88dvh;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.shead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;border-bottom:2px dashed var(--muted)}
.shead h2{margin:0;font-size:1.6rem;line-height:1.2;color:var(--red)}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer}
.sbody{overflow-y:auto;padding:4px 18px 8px;flex:1 1 auto;min-height:0}
.sfoot{display:flex;gap:10px;padding:12px 18px;border-top:2px dashed var(--muted)}
.sfoot .wa{flex:2}.sfoot .ghost{flex:1}
.sum{list-style:none;margin:6px 0;padding:0}
.sum li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--muted)}
.sum .nm{flex:1;line-height:1.25}
.sum .pr{font-weight:700;min-width:4.2em;text-align:right}
.sum .qty{margin-left:0}
.link{background:none;border:0;color:var(--red);font:600 .95rem Barlow,Arial,sans-serif;text-decoration:underline;padding:6px 0;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:8px 0}
label{display:block;font-weight:600;margin-top:10px}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;line-height:1.35}
textarea{min-height:84px;resize:vertical}
.ghost{background:transparent;border:2px solid var(--ink)!important;color:var(--ink)}
.hint{font-size:.9rem;color:var(--muted);margin-top:8px}

.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:14px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);font:700 .9rem Barlow,Arial,sans-serif;cursor:pointer}
.lang:focus-visible{outline:3px solid var(--red);outline-offset:2px}
body{position:relative}
header{padding-top:44px}
.social{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.social a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700}.social svg{width:20px;height:20px}.social a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:14px;display:flex;gap:8px;z-index:6}
.tools .lang{position:static}
.tbtn{width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
.tbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.cta.wa[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.sheet{position:relative}
.toast{margin:0 18px 10px;padding:10px 14px;border-radius:10px;background:var(--red);color:#fff;font-weight:700;text-align:center}
.toast:not([hidden]){animation:tIn .25s ease-out}
@keyframes tIn{from{opacity:0;transform:translateY(6px)}}
input.invalid{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.sfoot .wa{flex:1}
.item.fav{background:var(--paper);border:3px solid var(--red);border-radius:14px;padding:14px;margin:12px 0}
.badge{display:inline-block;background:var(--red);color:#fff;font:700 .85rem Barlow,Arial,sans-serif;padding:4px 12px;border-radius:999px;margin-bottom:8px}
@media (min-width:960px){
 header p{max-width:52ch}
 nav{text-align:center}
 main{max-width:1260px;display:grid;grid-template-columns:minmax(0,1fr) 360px;column-gap:48px;align-items:start;padding-bottom:56px}
 #menu{grid-column:1;columns:2;column-gap:48px}
 #menu section{break-inside:avoid}
 #encuentranos{grid-column:1}
 #side{grid-column:2;grid-row:1 / span 2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);margin-top:26px;border:3px solid var(--ink);border-radius:18px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
 #side .sheet{max-height:calc(100vh - 116px)}
 #side .x{display:none}
 #side .cta.wa{max-width:none}
 .bar{display:none}
}
#side[hidden]{display:none!important}
.review{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;text-decoration:none}
.review:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1.logoh{transform:none;line-height:0;margin:0}
.logo{width:min(230px,60vw);height:auto;display:block;margin:10px auto;border-radius:50%;box-shadow:0 0 0 4px var(--red),0 8px 20px rgba(0,0,0,.28)}
@media (min-width:960px){.logo{width:260px}}
@media (prefers-reduced-motion:no-preference){h1.logoh{animation:lpop .6s ease-out}@keyframes lpop{from{transform:scale(.85);opacity:0}}}
</style>
<script>
(function(){try{var t=localStorage.getItem("tdt-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
</script>

  else localStorage.removeItem("tdt-cart");
}catch(e){}
function saveCart(){try{if(Object.keys(cart).length)localStorage.setItem("tdt-cart",JSON.stringify({ts:Date.now(),items:cart}));else localStorage.removeItem("tdt-cart")}catch(e){}}
const label=k=>{const {it,vn}=info[k];return it.n[lang]+(vn?" ("+vn[lang]+")":"")};
const t=x=>T[lang][x];
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#lang").textContent=t("switchTo");
  $("#lang").setAttribute("aria-label",lang==="es"?"Switch to English":"Cambiar a español");
  $("#nav").setAttribute("aria-label",t("nav"));
  $("#close").setAttribute("aria-label",t("close"));
  $("#side").setAttribute("aria-label",t("yourOrder"));
  if(typeof paintTheme==="function")paintTheme();
  $("#nombre").placeholder=t("namePh"); $("#notas").placeholder=t("notesPh");
  const qb=k=>`<span class="qty" data-k="${k}"><button class="sub" type="button" hidden aria-label="${t("rem")} ${label(k)}">−</button><span class="n" aria-live="polite"></span><button class="add" type="button" aria-label="${t("add")} ${label(k)}">+</button></span>`;
  let nav="",out="";
  M.forEach(c=>{
    nav+=`<a href="#${c.id}">${c.t[lang]}</a>`;
    out+=`<section id="${c.id}"><h2>${c.t[lang]}</h2>`;
    c.items.forEach(it=>{
      const d=it.d?`<p class="desc">${it.d[lang]}</p>`:"";
      if(it.v.length===1&&!it.v[0][0]){
        const k=it.n.es+"|";
        out+=`<div class="item${it.fav?" fav":""}">${it.fav?`<span class="badge">${t("fav")}</span>`:""}<div class="row single"><h3>${it.n[lang]}</h3><span class="dots"></span><span class="price">${money(it.v[0][1])}</span>${qb(k)}</div>${d}</div>`;
      }else{
        out+=`<div class="item"><div class="row"><h3>${it.n[lang]}</h3></div>${d}`;
        it.v.forEach(([vn,p])=>{const k=it.n.es+"|"+vn.es;out+=`<div class="line"><span class="nm">${vn[lang]}</span><span class="pr">${money(p)}</span>${qb(k)}</div>`});
        out+=`</div>`;
      }
    });
    out+=`</section>`;
  });
  nav+=`<a href="#encuentranos">${t("find")}</a>`;
  $("#nav").innerHTML=nav; $("#menu").innerHTML=out;
  refresh();
}
function count(){let q=0,s=0;for(const k in cart){q+=cart[k];s+=cart[k]*info[k].p}return{q,s}}
function refresh(){
  saveCart();
  document.querySelectorAll("#menu .qty").forEach(el=>{const n=cart[el.dataset.k]||0;el.querySelector(".n").textContent=n||"";el.querySelector(".sub").hidden=!n});
  const {q,s}=count();
  $("#orderBtn").textContent=q?`${t("view")} (${q}) · ${money(s)}`:t("order");
  if($("#dlg").open||(typeof desk!=="undefined"&&desk.matches))renderSum();
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".qty button"); if(!b)return;
  const k=b.parentElement.dataset.k;
  cart[k]=(cart[k]||0)+(b.classList.contains("add")?1:-1);
  if(cart[k]<=0)delete cart[k];
  refresh();
});
function msg(){
  const {q,s}=count(), nm=$("#nombre").value.trim(), nt=$("#notas").value.trim();
  if(!q) return t("hello")+(nm?"\n👤 "+nm:"")+(nt?"\n📝 "+t("msgNotes")+": "+nt:"");
  let m="🌮 *"+t("msgHead")+"*";
  if(nm)m+="\n👤 "+nm;
  m+="\n\n"+Object.keys(cart).map(k=>`• ${cart[k]}x ${label(k)} — ${money(cart[k]*info[k].p)}`).join("\n");
  m+=`\n\n*Subtotal: ${money(s)}* ${t("msgTax")}`;
  if(nt)m+="\n\n📝 "+t("msgNotes")+": "+nt;
  return m;
}
function syncLink(){const b=$("#send"),q=count().q,ok=q&&$("#nombre").value.trim();if(ok){b.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg());b.removeAttribute("aria-disabled")}else{b.removeAttribute("href");b.setAttribute("aria-disabled","true")}}
function renderSum(){
  const {q,s}=count();
  $("#sum").innerHTML=q?Object.keys(cart).map(k=>`<li><span class="nm">${label(k)}</span><span class="qty" data-k="${k}"><button class="sub" type="button" aria-label="${t("rem")} ${label(k)}">−</button><span class="n">${cart[k]}</span><button class="add" type="button" aria-label="${t("add")} ${label(k)}">+</button></span><span class="pr">${money(cart[k]*info[k].p)}</span></li>`).join(""):`<li><span class="nm">${t("empty")}</span></li>`;
  $("#tot").textContent=money(s);
  $("#clear").hidden=!q;
  syncLink();
}
$("#orderBtn").onclick=()=>{
  try{if(!$("#nombre").value)$("#nombre").value=localStorage.getItem("tdt-nombre")||""}catch(e){}
  renderSum(); $("#dlg").showModal(); $("#close").focus();
};
$("#lang").onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("tdt-lang",lang)}catch(e){}render()};
$("#clear").onclick=()=>{for(const k in cart)delete cart[k];refresh()};
$("#nombre").oninput=$("#notas").oninput=syncLink;
$("#close").onclick=()=>$("#dlg").close();
let tTimer;
function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>el.hidden=true,3500)}
$("#nombre").addEventListener("input",()=>{$("#nombre").classList.remove("invalid");$("#nombre").removeAttribute("aria-invalid");if($("#nombre").value.trim())$("#toast").hidden=true});
$("#send").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!$("#send").hasAttribute("href")){e.preventDefault();$("#send").click()}});
$("#send").onclick=e=>{
  if(!count().q){e.preventDefault();toast(t("needItems"));return}
  if(!$("#nombre").value.trim()){e.preventDefault();const n=$("#nombre");n.classList.add("invalid");n.setAttribute("aria-invalid","true");n.focus();toast(t("needName"));return}
  syncLink();try{const nm=$("#nombre").value.trim();if(nm)localStorage.setItem("tdt-nombre",nm)}catch(e){}
  setTimeout(()=>{for(const k in cart)delete cart[k];$("#notas").value="";if($("#dlg").open)$("#dlg").close();refresh()},400);
};

const MOON=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`,SUN=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>`;
const mq=window.matchMedia("(prefers-color-scheme: dark)");
const curTheme=()=>document.documentElement.getAttribute("data-theme")||(mq.matches?"dark":"light");
function paintTheme(){const d=curTheme()==="dark";const b=document.getElementById("theme");b.innerHTML=d?SUN:MOON;b.setAttribute("aria-label",d?t("toLight"):t("toDark"))}
document.getElementById("theme").onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("tdt-theme",n)}catch(e){}paintTheme()};
mq.addEventListener&&mq.addEventListener("change",paintTheme);
paintTheme();
const desk=window.matchMedia("(min-width:960px)");
function place(){
  const sh=document.querySelector(".sheet");
  if(desk.matches){
    if($("#dlg").open)$("#dlg").close();
    $("#side").appendChild(sh); $("#side").hidden=false; renderSum();
  }else{
    $("#dlg").appendChild(sh); $("#side").hidden=true;
  }
}
desk.addEventListener&&desk.addEventListener("change",place);
try{$("#nombre").value=localStorage.getItem("tdt-nombre")||""}catch(e){}
render();
place();
</script>
</body>
</html>
